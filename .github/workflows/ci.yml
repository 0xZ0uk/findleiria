name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No varlock usage reports from CI (DO_NOT_TRACK is honored by varlock and turbo).
  VARLOCK_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every action is pinned to a full commit SHA (a tag can be moved to
      # malicious code; a SHA cannot). The trailing comment is the release it
      # was resolved from; bump both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input: pnpm/action-setup reads it from `packageManager`.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # varlock needs Node >= 22.3.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The server, db and auth tests run on `bun test`; README asks for Bun 1.4+.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec turbo run check-types --concurrency=2 --ui=stream

      # Tests are offline and need no .env: bunfig.toml turns Bun's env loading
      # off and the test preloads point every database at a throwaway one.
      - name: Test
        run: pnpm exec turbo run test --concurrency=2 --ui=stream

      # `vite build` is deliberately not run here: the web build prerenders
      # event pages from the Turso snapshot, which needs a database and
      # secrets that PR CI does not have. Vercel builds and deploys.
